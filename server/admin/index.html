<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Interview Atlas CMS</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23146b4b'/%3E%3Cpath d='M18 18h28v8H26v6h17v8H26v6h20v8H18z' fill='white'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/admin-ui/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <span class="eyebrow">Cuckoders · редакция</span>
        <h1>Interview Atlas CMS</h1>
      </div>
      <div class="auth">
        <label for="token">Токен редактора</label>
        <div class="auth-row">
          <input id="token" type="password" autocomplete="off" placeholder="CMS_ADMIN_TOKEN" />
          <button id="connect" type="button">Подключиться</button>
        </div>
      </div>
    </header>

    <main class="layout">
      <aside class="library" aria-label="Материалы">
        <div class="section-heading">
          <div><span class="eyebrow">Библиотека</span><h2>Материалы</h2></div>
          <button id="new-item" class="secondary" type="button">+ Новый</button>
        </div>
        <div class="filters">
          <select id="filter-type" aria-label="Тип материала">
            <option value="">Все типы</option><option value="question">Вопросы</option>
            <option value="task">Задачи</option><option value="video">Видео</option><option value="track">Треки</option>
          </select>
          <select id="filter-status" aria-label="Статус материала">
            <option value="">Все статусы</option><option value="draft">Черновик</option>
            <option value="review">На ревью</option><option value="published">Опубликовано</option>
            <option value="archived">Архив</option>
          </select>
        </div>
        <p id="library-state" class="muted">Введите токен редактора.</p>
        <div id="content-list" class="content-list"></div>
      </aside>

      <section class="editor" aria-label="Редактор материала">
        <div class="section-heading">
          <div><span class="eyebrow">Версия <span id="version">новая</span></span><h2 id="editor-title">Новый материал</h2></div>
          <span id="status" class="status draft">draft</span>
        </div>
        <form id="content-form">
          <div class="grid two">
            <label>Тип<select id="type" required>
              <option value="question">Вопрос</option><option value="task">Задача</option>
              <option value="video">Видео</option><option value="track">Трек</option>
            </select></label>
            <label>Направление<select id="specialty" required>
              <option>Frontend</option><option>Backend</option><option>Mobile</option><option>QA</option>
            </select></label>
          </div>
          <label>Заголовок<input id="title" required minlength="3" maxlength="300" /></label>
          <div class="grid two">
            <label>Редактор<input id="editor" required maxlength="120" placeholder="Имя редактора" /></label>
            <label>Следующая ревизия<input id="next-review" type="datetime-local" required /></label>
          </div>
          <div class="grid two">
            <label>Источник<input id="source-label" required maxlength="120" placeholder="Документация / автор" /></label>
            <label>HTTPS-ссылка<input id="source-url" type="url" placeholder="https://…" /></label>
          </div>
          <label>Теги через запятую<input id="tags" maxlength="1000" placeholder="React, rendering, performance" /></label>
          <label>Данные материала в JSON
            <textarea id="payload" required spellcheck="false" rows="14"></textarea>
          </label>
          <p class="hint">Схема меняется вместе с типом. JSON валидируется сервером; HTML не используется.</p>
          <div id="message" role="status" class="message"></div>
          <div class="actions">
            <button id="save" type="submit">Сохранить новую версию</button>
            <button id="to-review" class="secondary" type="button">Отправить на ревью</button>
            <button id="publish" class="success" type="button">Опубликовать</button>
            <button id="archive" class="danger" type="button">В архив</button>
          </div>
        </form>
      </section>
    </main>
    <script src="/admin-ui/app.js" defer></script>
  </body>
</html>
